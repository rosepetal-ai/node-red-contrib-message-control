<style type="text/css">
.rosepetal-message-snapshot-panel {
  margin-top: 12px;
  border: 1px solid var(--red-ui-secondary-border-color, #d9d9d9);
  border-radius: 4px;
  background: var(--red-ui-secondary-background, #f7f7f7);
  color: var(--red-ui-primary-text-color, #333);
  display: none;
  flex-direction: column;
}

.rosepetal-message-snapshot-panel.visible {
  display: flex;
}

.rosepetal-message-snapshot-floating {
  position: absolute;
  margin-top: 0;
  top: 0;
  left: 0;
  width: min(340px, calc(100vw - 32px));
  max-height: calc(100vh - 32px);
  box-shadow: var(--red-ui-box-shadow, 0 12px 32px rgba(0, 0, 0, 0.18));
  z-index: 1400;
  pointer-events: auto;
}

.rosepetal-message-snapshot-floating .rosepetal-message-snapshot-body {
  max-height: calc(100vh - 220px);
  overflow-y: auto;
}

.rosepetal-message-snapshot-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--red-ui-secondary-border-color, #d9d9d9);
  font-weight: 600;
  background: var(--red-ui-secondary-highlight, #ededed);
}

.rosepetal-message-snapshot-title {
  display: flex;
  align-items: center;
  gap: 6px;
}

.rosepetal-message-snapshot-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.rosepetal-message-snapshot-actions .red-ui-button {
  min-width: 0;
  padding: 0 6px;
}

.rosepetal-message-snapshot-body {
  padding: 8px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.rosepetal-message-snapshot-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.9em;
  color: var(--red-ui-secondary-text-color, #666);
}

.rosepetal-message-snapshot-section {
  border: 1px solid var(--red-ui-tertiary-border-color, #e2e2e2);
  border-radius: 4px;
  overflow: hidden;
}

.rosepetal-message-snapshot-section-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-weight: 600;
  padding: 6px 10px;
  background: var(--red-ui-tertiary-background, #fafafa);
  border-bottom: 1px solid var(--red-ui-tertiary-border-color, #e2e2e2);
}

.rosepetal-message-snapshot-section-header .rosepetal-message-snapshot-timestamp {
  font-size: 0.85em;
  color: var(--red-ui-secondary-text-color, #666);
}

.rosepetal-message-snapshot-json {
  margin: 0;
  padding: 10px;
  background: transparent;
  max-height: 240px;
  overflow: auto;
  font-family: var(--red-ui-monospace-font, monospace);
  font-size: 0.85em;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-word;
}

.rosepetal-message-snapshot-empty {
  font-style: italic;
  color: var(--red-ui-secondary-text-color, #666);
  padding: 0 10px 10px;
}

.rosepetal-message-snapshot-error {
  color: var(--red-ui-warn-text-color, #d63f3f);
}

.rosepetal-message-snapshot-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  font-size: 0.85em;
  color: var(--red-ui-secondary-text-color, #666);
}

.rosepetal-message-snapshot-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 6px;
  border-radius: 4px;
  border: 1px solid transparent;
}

.rosepetal-message-snapshot-toggle input {
  margin: 0;
}

.rosepetal-message-snapshot-toggle-disabled {
  opacity: 0.5;
  pointer-events: none;
}
</style>
<script type="text/javascript">
(function() {
  const PLUGIN_ID = "rosepetal-message-control/inspector";
  const PANEL_CLASS = "rosepetal-message-snapshot-panel";
  const REFRESH_BUTTON_CLASS = "rosepetal-message-snapshot-refresh";
  let originalRefresh;
  let currentNodeId = null;
  let pendingRequest = null;
  let pendingSettingsRequest = null;
  let selectionListenerAttached = false;
  let runtimeSettings = {
    enabled: true
  };
  let toggleBusy = false;
  let suppressToggleEvents = 0;

  function buildAdminUrl(path) {
    let base = (RED.settings && RED.settings.apiRootUrl) || "";
    if (base.length && base.slice(-1) !== '/') {
      base += '/';
    }
    return base + path.replace(/^\//, '');
  }

  function shouldInspect(node) {
    if (!node || Array.isArray(node)) {
      return false;
    }
    if (!node.id) {
      return false;
    }
    const type = node.type || "";
    if (type === 'tab' || type === 'group') {
      return false;
    }
    if (type === 'subflow' || /^subflow:/.test(type)) {
      return false;
    }
    return true;
  }

  function getNodeFromSelection(selection) {
    if (!selection) {
      return null;
    }
    if (selection.nodes) {
      if (!Array.isArray(selection.nodes) || selection.nodes.length !== 1) {
        return null;
      }
      const entry = selection.nodes[0];
      return entry && (entry.node || entry) || null;
    }
    if (Array.isArray(selection)) {
      if (selection.length !== 1) {
        return null;
      }
      return selection[0] && (selection[0].node || selection[0]) || null;
    }
    if (selection.id && selection.type) {
      return selection;
    }
    return null;
  }

  function ensurePanel() {
    const content = $(".red-ui-sidebar-info .red-ui-info-table").parent();
    if (!content.length) {
      return null;
    }
    let panel = content.children('.' + PANEL_CLASS);
    if (!panel.length) {
      panel = $('<div>').addClass(PANEL_CLASS).appendTo(content);
      const header = $('<div>').addClass('rosepetal-message-snapshot-header').appendTo(panel);
      $('<span>').addClass('rosepetal-message-snapshot-title')
        .append($('<i class="fa fa-history"></i>'))
        .append(' Message Snapshot')
        .appendTo(header);
      const refreshBtn = $('<button type="button" class="red-ui-button red-ui-button-small"></button>')
        .addClass(REFRESH_BUTTON_CLASS)
        .append('<i class="fa fa-refresh"></i>')
        .appendTo(header);
      refreshBtn.on('click', function(evt) {
        evt.preventDefault();
        if (!runtimeSettings.enabled) {
          showSnapshotsDisabled(panel);
          return;
        }
        if (currentNodeId) {
          fetchSnapshot(currentNodeId);
        }
      });
      const body = $('<div>').addClass('rosepetal-message-snapshot-body').appendTo(panel);
      const controls = $('<div>').addClass('rosepetal-message-snapshot-controls').appendTo(body);
      const enabledToggle = createToggle('Capture snapshots', 'Enable or pause message recording');
      controls.append(enabledToggle.wrapper);
      const status = $('<div>').addClass('rosepetal-message-snapshot-status').hide().appendTo(body);
      const statusIcon = $('<i class="fa"></i>').appendTo(status);
      const statusText = $('<span></span>').appendTo(status);

      const inputSection = createSection('Last Input').appendTo(body);
      const outputSection = createSection('Last Output').appendTo(body);

      panel.data('elements', {
        body,
        status,
        statusIcon,
        statusText,
        inputSection,
        outputSection,
        refreshButton: refreshBtn,
        enabledToggle
      });

      enabledToggle.checkbox.on('change', function() {
        if (suppressToggleEvents) {
          return;
        }
        updateRuntimeSetting({ enabled: this.checked });
      });

      updateToggleUI(panel);
    }
    return panel;
  }

  function createSection(title) {
    const section = $('<div>').addClass('rosepetal-message-snapshot-section');
    const header = $('<div>').addClass('rosepetal-message-snapshot-section-header').appendTo(section);
    $('<span>').text(title).appendTo(header);
    const timestamp = $('<span>').addClass('rosepetal-message-snapshot-timestamp').appendTo(header);
    const content = $('<pre>').addClass('rosepetal-message-snapshot-json').appendTo(section);
    const empty = $('<div>').addClass('rosepetal-message-snapshot-empty').hide().appendTo(section);
    section.data('elements', {
      header,
      timestamp,
      content,
      empty
    });
    return section;
  }

  function createToggle(label, description) {
    const wrapper = $('<label>').addClass('rosepetal-message-snapshot-toggle');
    if (description) {
      wrapper.attr('title', description);
    }
    const checkbox = $('<input type="checkbox">').appendTo(wrapper);
    $('<span>').text(label).appendTo(wrapper);
    return {
      wrapper,
      checkbox
    };
  }

  function formatTimestamp(ts) {
    if (!ts) {
      return 'No data yet';
    }
    try {
      const date = new Date(ts);
      if (!isNaN(date.getTime())) {
        return date.toLocaleString();
      }
    } catch (err) {
      // fall through
    }
    return String(ts);
  }

  function formatMessage(value) {
    if (value === null) {
      return 'null';
    }
    if (value === undefined) {
      return 'undefined';
    }
    if (typeof value === 'string') {
      return value;
    }
    try {
      return JSON.stringify(value, null, 2);
    } catch (err) {
      return String(value);
    }
  }

  function setStatus(panel, type, text) {
    const elements = panel.data('elements');
    if (!elements) {
      return;
    }
    const { status, statusIcon, statusText, inputSection, outputSection } = elements;
    status.removeClass('rosepetal-message-snapshot-error');
    if (!text) {
      status.hide();
      return;
    }
    status.show();
    statusText.text(text);
    statusIcon.removeClass();
    statusIcon.addClass('fa');
    switch (type) {
      case 'loading':
        statusIcon.addClass('fa-refresh fa-spin');
        break;
      case 'error':
        statusIcon.addClass('fa-exclamation-triangle');
        status.addClass('rosepetal-message-snapshot-error');
        break;
      default:
        statusIcon.addClass('fa-info-circle');
        break;
    }
    inputSection.toggle(type !== 'error');
    outputSection.toggle(type !== 'error');
  }

  function renderSection(section, snapshot, timestamp, skipped, note) {
    const elements = section.data('elements');
    if (!elements) {
      return;
    }
    const { timestamp: timeEl, content, empty } = elements;
    const hasData = snapshot !== null && snapshot !== undefined;
    let label = formatTimestamp(timestamp);
    if (hasData && note) {
      label += ' · ' + note;
    }
    if (hasData && typeof skipped === 'number' && skipped > 0) {
      label += ' · +' + skipped + ' newer not sampled';
    }
    timeEl.text(label);
    if (hasData) {
      empty.hide();
      content.show().text(formatMessage(snapshot));
    } else {
      content.hide();
      empty.text('No data captured yet.').show();
    }
  }

  function clearPanel(panel) {
    const elements = panel && panel.data('elements');
    if (!elements) {
      return;
    }
    if (pendingRequest) {
      pendingRequest.abort();
      pendingRequest = null;
    }
    elements.status.hide();
    renderSection(elements.inputSection, null, null);
    renderSection(elements.outputSection, null, null);
    elements.inputSection.find('.rosepetal-message-snapshot-empty').text('Select a node to view its last input message.');
    elements.outputSection.find('.rosepetal-message-snapshot-empty').text('Select a node to view its last output message.');
    currentNodeId = null;
    if (runtimeSettings.enabled) {
      panel.removeClass('visible');
    } else {
      showSnapshotsDisabled(panel);
    }
  }

  function updateToggleUI(panel) {
    const targetPanel = panel || ensurePanel();
    if (!targetPanel) {
      return;
    }
    const elements = targetPanel.data('elements');
    if (!elements || !elements.enabledToggle) {
      return;
    }
    suppressToggleEvents += 1;
    elements.enabledToggle.checkbox.prop('checked', !!runtimeSettings.enabled);
    suppressToggleEvents -= 1;

    elements.enabledToggle.checkbox.prop('disabled', toggleBusy);
    elements.enabledToggle.wrapper.toggleClass('rosepetal-message-snapshot-toggle-disabled', toggleBusy);
    if (elements.refreshButton) {
      elements.refreshButton.prop('disabled', !runtimeSettings.enabled);
    }
  }

  function showSnapshotsDisabled(panel) {
    const targetPanel = panel || ensurePanel();
    if (!targetPanel) {
      return;
    }
    const elements = targetPanel.data('elements');
    if (!elements) {
      return;
    }
    if (pendingRequest) {
      pendingRequest.abort();
      pendingRequest = null;
    }
    updateToggleUI(targetPanel);
    targetPanel.addClass('visible');
    elements.status.show().removeClass('rosepetal-message-snapshot-error');
    elements.statusIcon.removeClass().addClass('fa fa-pause-circle');
    elements.statusText.text('Snapshots paused. Enable capture to resume.');
    elements.inputSection.hide();
    elements.outputSection.hide();
  }

  function getCurrentNodeInstance() {
    if (!currentNodeId || !RED.nodes || typeof RED.nodes.node !== 'function') {
      return null;
    }
    try {
      return RED.nodes.node(currentNodeId) || null;
    } catch (err) {
      return null;
    }
  }

  function handleSettingsApplied(panel, previousState) {
    const targetPanel = panel || ensurePanel();
    updateToggleUI(targetPanel);
    if (!runtimeSettings.enabled) {
      showSnapshotsDisabled(targetPanel);
      return;
    }
    if (!previousState) {
      return;
    }
    const reEnabled = !previousState.enabled && runtimeSettings.enabled;
    if (reEnabled && currentNodeId) {
      const node = getCurrentNodeInstance();
      if (node) {
        updateSnapshot(node);
      }
    }
  }

  function fetchRuntimeSettings(options = {}) {
    const panel = options.panel || ensurePanel();
    const url = buildAdminUrl('rosepetal/message-control/settings');
    if (pendingSettingsRequest) {
      pendingSettingsRequest.abort();
      pendingSettingsRequest = null;
    }
    const request = $.ajax({
      url,
      dataType: 'json',
      cache: false
    }).done(function(data) {
      if (!data) {
        return;
      }
      const previousState = {
        enabled: runtimeSettings.enabled
      };
      if (Object.prototype.hasOwnProperty.call(data, 'enabled') && typeof data.enabled === 'boolean') {
        runtimeSettings.enabled = data.enabled;
      }
      handleSettingsApplied(panel, previousState);
    }).fail(function() {
      if (!options.silent) {
        const targetPanel = panel || ensurePanel();
        if (targetPanel) {
          setStatus(targetPanel, 'error', 'Unable to load snapshot settings.');
        }
      }
    }).always(function() {
      if (pendingSettingsRequest === request) {
        pendingSettingsRequest = null;
      }
    });
    pendingSettingsRequest = request;
    return request;
  }

  function updateRuntimeSetting(patch) {
    const panel = ensurePanel();
    if (!panel) {
      return;
    }

    const desired = {};
    if (Object.prototype.hasOwnProperty.call(patch, 'enabled')) {
      const targetState = !!patch.enabled;
      if (targetState !== runtimeSettings.enabled) {
        desired.enabled = targetState;
      }
    }

    if (!Object.keys(desired).length) {
      updateToggleUI(panel);
      return;
    }

    const previousState = {
      enabled: runtimeSettings.enabled
    };

    toggleBusy = true;
    updateToggleUI(panel);

    const csrfToken = RED.settings && RED.settings.csrfToken;
    const payload = { ...desired };
    if (csrfToken) {
      payload._csrf = csrfToken;
    }

    $.ajax({
      method: 'POST',
      url: buildAdminUrl('rosepetal/message-control/settings'),
      data: JSON.stringify(payload),
      contentType: 'application/json',
      processData: false,
      cache: false
    }).done(function(data) {
      if (data && typeof data === 'object' && Object.prototype.hasOwnProperty.call(data, 'enabled') && typeof data.enabled === 'boolean') {
        runtimeSettings.enabled = data.enabled;
      }
      handleSettingsApplied(panel, previousState);
    }).fail(function() {
      runtimeSettings.enabled = previousState.enabled;
      setStatus(panel, 'error', 'Unable to update snapshot settings.');
      updateToggleUI(panel);
    }).always(function() {
      toggleBusy = false;
      updateToggleUI(panel);
    });
  }

  function updateSnapshot(node) {
    const panel = ensurePanel();
    if (!panel) {
      return;
    }
    if (!shouldInspect(node)) {
      clearPanel(panel);
      return;
    }
    currentNodeId = node.id;
    updateToggleUI(panel);
    if (!runtimeSettings.enabled) {
      showSnapshotsDisabled(panel);
      return;
    }
    panel.addClass('visible');
    if (pendingRequest) {
      pendingRequest.abort();
      pendingRequest = null;
    }
    const elements = panel.data('elements');
    if (!elements) {
      return;
    }
    elements.inputSection.show();
    elements.outputSection.show();
    setStatus(panel, 'loading', 'Loading snapshot…');
    renderSection(elements.inputSection, null, null);
    renderSection(elements.outputSection, null, null);
    fetchSnapshot(node.id, panel);
  }

  function fetchSnapshot(nodeId, panel) {
    const targetPanel = panel || ensurePanel();
    if (!targetPanel) {
      return;
    }
    if (!runtimeSettings.enabled) {
      showSnapshotsDisabled(targetPanel);
      return;
    }
    const url = buildAdminUrl('rosepetal/message-control/nodes/' + encodeURIComponent(nodeId));
    if (pendingRequest) {
      pendingRequest.abort();
      pendingRequest = null;
    }
    const request = $.ajax({
      url,
      dataType: 'json',
      cache: false
    }).done(function(data) {
      if (nodeId !== currentNodeId) {
        return;
      }
      setStatus(targetPanel, null, null);
      const elements = targetPanel.data('elements');
      const hasAnyData = !!(data && (data.lastInput !== null || data.lastOutput !== null));
      if (!hasAnyData) {
        renderSection(elements.inputSection, null, data ? data.lastInputAt : null);
        renderSection(elements.outputSection, null, data ? data.lastOutputAt : null);
        elements.inputSection.find('.rosepetal-message-snapshot-empty').text('No input captured for this node yet.');
        elements.outputSection.find('.rosepetal-message-snapshot-empty').text('No output captured for this node yet.');
      } else {
        renderSection(elements.inputSection, data.lastInput, data.lastInputAt, data.inputSkipped);
        const unwiredNote = data.lastOutputWired === false
          ? 'output ' + ((typeof data.lastOutputPort === 'number' ? data.lastOutputPort : 0) + 1) + ' has no wires'
          : null;
        renderSection(elements.outputSection, data.lastOutput, data.lastOutputAt, data.outputSkipped, unwiredNote);
      }
    }).fail(function(jqXHR) {
      if (nodeId !== currentNodeId) {
        return;
      }
      if (jqXHR && (jqXHR.status === 0 || jqXHR.statusText === 'abort')) {
        return;
      }
      if (jqXHR && jqXHR.status === 404) {
        setStatus(targetPanel, null, 'No snapshots recorded for this node yet.');
        renderSection(targetPanel.data('elements').inputSection, null, null);
        renderSection(targetPanel.data('elements').outputSection, null, null);
      } else {
        setStatus(targetPanel, 'error', 'Unable to load snapshot.');
      }
    }).always(function() {
      if (pendingRequest === request) {
        pendingRequest = null;
      }
    });
    pendingRequest = request;
  }

  function patchInfoPanel() {
    if (!RED.sidebar || !RED.sidebar.info || typeof RED.sidebar.info.refresh !== 'function') {
      setTimeout(patchInfoPanel, 300);
      return;
    }
    if (RED.sidebar.info.__rosepetalMessageSnapshotPatched) {
      return;
    }
    originalRefresh = RED.sidebar.info.refresh;
    RED.sidebar.info.refresh = function(node) {
      originalRefresh.call(RED.sidebar.info, node);
      try {
        updateSnapshot(node);
      } catch (err) {
        console.warn('rosepetal-message-control: failed to update snapshot panel', err);
      }
    };
    RED.sidebar.info.__rosepetalMessageSnapshotPatched = true;
  }

  function attachSelectionListener() {
    if (!RED.events || typeof RED.events.on !== 'function') {
      setTimeout(attachSelectionListener, 300);
      return;
    }
    if (selectionListenerAttached) {
      return;
    }
    RED.events.on('view:selection-changed', function(selection) {
      const node = getNodeFromSelection(selection);
      updateSnapshot(node);
    });
    selectionListenerAttached = true;
    try {
      const currentSelection = RED.view && typeof RED.view.selection === 'function' ? RED.view.selection() : null;
      const node = getNodeFromSelection(currentSelection);
      if (node) {
        updateSnapshot(node);
      }
    } catch (err) {
      // ignore bootstrap errors
    }
  }

  const definition = {
    type: 'ui',
    onadd: function() {
      patchInfoPanel();
      attachSelectionListener();
      fetchRuntimeSettings({ silent: true });
    }
  };

  RED.plugins.registerPlugin(PLUGIN_ID, definition);
})();
</script>
